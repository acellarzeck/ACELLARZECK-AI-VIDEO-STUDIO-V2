name: Build ACELLARZECK AI VIDEO STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q ACELLARZECK-AI-VIDEO-STUDIO-starter.zip -d source

      - name: Apply Java 17 compatibility
        run: cp app/build.gradle.kts source/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACELLARZECK-AI-VIDEO-STUDIO-debug
          path: source/app/build/outputs/apk/debug/app-debug.apk
